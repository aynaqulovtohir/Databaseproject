# Har bir PR va main'ga push: backend testlari, frontend tekshiruvi va brauzer testlari.
# Action'lar commit SHA bilan bog'langan (teg ko'chirilsa ham boshqa kod ishga tushmaydi).
# Maxfiy kalitlar (AI, Telegram) ishlatilmaydi: parollar har safar tasodifiy yaratiladi.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: dbproject
          POSTGRES_USER: dbproject
          POSTGRES_PASSWORD: ci-parol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbproject" --health-interval 5s --health-timeout 5s --health-retries 10
      # Virtual laboratoriya qum qutisi (docker-compose.yml dagi lab_db kabi)
      lab_db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: lab_sandbox
          POSTGRES_USER: lab_admin
          POSTGRES_PASSWORD: ci-lab-parol
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lab_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-faqat-testlar-uchun-maxfiy-emas
      # Lokal testlar bilan bir xil sharoit (cookie Secure belgisi DEBUG ga bog'liq)
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      POSTGRES_DB: dbproject
      POSTGRES_USER: dbproject
      POSTGRES_PASSWORD: ci-parol
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      LAB_DB_HOST: localhost
      LAB_DB_PORT: "5433"
      LAB_DB_USER: lab_admin
      LAB_DB_PASSWORD: ci-lab-parol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Migratsiyalar modellarga mos
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test --noinput
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Ogohlantirishlar ham xato: tozalangan holat saqlansin
      - run: npm run lint -- --deny-warnings
      # tsc -b va vite build
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Konteynerlar frontend/ papkasini ulaydi: paketlar shu yerda o'rnatiladi
      - run: npm ci
        working-directory: frontend
      - name: Test muhiti uchun .env (tasodifiy parollar)
        run: |
          umask 077
          python3 - <<'EOF'
          import secrets
          values = {
              "SECRET_KEY": secrets.token_urlsafe(50),
              "DEBUG": "True",
              "ALLOWED_HOSTS": "localhost,127.0.0.1",
              "POSTGRES_DB": "dbproject",
              "POSTGRES_USER": "dbproject",
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "POSTGRES_HOST": "db",
              "POSTGRES_PORT": "5432",
              "LAB_DB_USER": "lab_admin",
              "LAB_DB_PASSWORD": secrets.token_urlsafe(24),
          }
          with open(".env", "w") as f:
              f.writelines(f"{key}={value}\n" for key, value in values.items())
          EOF
      - run: ./e2e.sh
      - name: Playwright hisoboti
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
